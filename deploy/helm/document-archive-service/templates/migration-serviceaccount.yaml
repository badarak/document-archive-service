# Identity of the migration job, bound in Vault to the policy that reads the migrator password only. A hook, so that it
# exists before the job, at the first install too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archive.migrationName" . }}
  labels:
    {{- include "archive.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation

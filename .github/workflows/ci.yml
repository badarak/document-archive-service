name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Pinned Maven version, downloaded from Maven Central rather than taken from the runner image.
      - name: Set up Maven
        run: |
          curl --silent --show-error --fail --location \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      # Runs unit and integration tests, ktlint, the enforcer rules and the aggregated coverage threshold.
      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-aggregate-report
          path: report/target/site/jacoco-aggregate/
          if-no-files-found: ignore

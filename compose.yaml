# Local development services. Values come from the .env file (see .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${ARCHIVE_DB_NAME:?set it in .env}
      # Superuser of the container, used only by the init script: neither the application nor Liquibase connects with it.
      POSTGRES_USER: ${ARCHIVE_DB_ADMIN_USERNAME:?set it in .env}
      POSTGRES_PASSWORD: ${ARCHIVE_DB_ADMIN_PASSWORD:?set it in .env}
      ARCHIVE_DB_MIGRATOR_USERNAME: ${ARCHIVE_DB_MIGRATOR_USERNAME:?set it in .env}
      ARCHIVE_DB_MIGRATOR_PASSWORD: ${ARCHIVE_DB_MIGRATOR_PASSWORD:?set it in .env}
      ARCHIVE_DB_USERNAME: ${ARCHIVE_DB_USERNAME:?set it in .env}
      ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:?set it in .env}
    ports:
      - "${ARCHIVE_DB_PORT:?set it in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts only run on an empty data volume: use "docker compose down -v" to replay them.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  # S3-compatible object storage. The official minio/minio image is no longer published,
  # so this uses the community-maintained pgsty build.
  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: miniostorage
    command: server /data --console-address ":9001"
    environment:
      # Root account of the container, for its console and the setup below: the application uses an account of its own.
      MINIO_ROOT_USER: ${ARCHIVE_S3_ROOT_USER:?set it in .env}
      MINIO_ROOT_PASSWORD: ${ARCHIVE_S3_ROOT_PASSWORD:?set it in .env}
    ports:
      - "${ARCHIVE_S3_PORT:?set it in .env}:9000"
      - "${ARCHIVE_S3_CONSOLE_PORT:?set it in .env}:9001"
    volumes:
      - miniodata:/data

  # Creates the bucket and the account of the application, limited to the objects under documents/, then exits.
  minio-setup:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      - minio
    entrypoint: /setup.sh
    environment:
      MINIO_ROOT_USER: ${ARCHIVE_S3_ROOT_USER:?set it in .env}
      MINIO_ROOT_PASSWORD: ${ARCHIVE_S3_ROOT_PASSWORD:?set it in .env}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:?set it in .env}
      ARCHIVE_S3_ACCESS_KEY: ${ARCHIVE_S3_ACCESS_KEY:?set it in .env}
      ARCHIVE_S3_SECRET_KEY: ${ARCHIVE_S3_SECRET_KEY:?set it in .env}
    volumes:
      - ./docker/minio/setup.sh:/setup.sh:ro

  # Local authorization server: issues the access tokens of two calling services, one per tenant. The realm is
  # imported at each start from docker/keycloak; nothing is persisted, so changes made in the console are lost.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ARCHIVE_KEYCLOAK_ADMIN_USERNAME:?set it in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ARCHIVE_KEYCLOAK_ADMIN_PASSWORD:?set it in .env}
      ARCHIVE_KEYCLOAK_ACME_CLIENT_SECRET: ${ARCHIVE_KEYCLOAK_ACME_CLIENT_SECRET:?set it in .env}
      ARCHIVE_KEYCLOAK_GLOBEX_CLIENT_SECRET: ${ARCHIVE_KEYCLOAK_GLOBEX_CLIENT_SECRET:?set it in .env}
      ARCHIVE_KEYCLOAK_PROMETHEUS_CLIENT_SECRET: ${ARCHIVE_KEYCLOAK_PROMETHEUS_CLIENT_SECRET:?set it in .env}
    ports:
      - "${ARCHIVE_KEYCLOAK_PORT:?set it in .env}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # Local observability, started only with "docker compose --profile observability up": Grafana with Prometheus, Loki
  # and Tempo, which receive the metrics, logs and traces the application pushes over OTLP with its observability
  # profile. Grafana is on http://localhost:3000, with the dashboard of docker/grafana already loaded.
  grafana:
    image: grafana/otel-lgtm:0.36.0
    profiles: [observability]
    ports:
      - "${ARCHIVE_GRAFANA_PORT:-3000}:3000"
      - "${ARCHIVE_OTLP_PORT:-4318}:4318"
    volumes:
      - ./docker/grafana/provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/document-archive.yaml:ro
      - ./docker/grafana/dashboards:/otel-lgtm/document-archive-dashboards:ro

volumes:
  pgdata:
  miniodata:

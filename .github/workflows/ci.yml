name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Runs tests, ktlint, the enforcer rules and the aggregated coverage threshold.
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-aggregate-report
          path: report/target/site/jacoco-aggregate/
          if-no-files-found: ignore

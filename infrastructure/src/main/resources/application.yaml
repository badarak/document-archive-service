spring:
  application:
    name: document-archive-service
  datasource:
    url: ${ARCHIVE_DB_URL}
    username: ${ARCHIVE_DB_USERNAME}
    password: ${ARCHIVE_DB_PASSWORD}
  liquibase:
    # The archive schema is provisioned outside the application and must exist before startup:
    # Liquibase stores its tracking tables in it.
    liquibase-schema: archive
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Liquibase; Hibernate only checks that entities match it.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Access tokens must come from this issuer, carry a signature that one of its published
          # public keys verifies, and be intended for this service. Setting both URIs avoids any
          # call to the issuer at startup.
          issuer-uri: ${ARCHIVE_JWT_ISSUER}
          jwk-set-uri: ${ARCHIVE_JWT_JWKS_URI}
          audiences: ${ARCHIVE_JWT_AUDIENCE}

archive:
  documents:
    allowed-extensions: ${ARCHIVE_ALLOWED_EXTENSIONS:pdf,doc,docx,mp3,wav,m4a,eml}
  storage:
    s3:
      endpoint: ${ARCHIVE_S3_ENDPOINT}
      region: ${ARCHIVE_S3_REGION}
      bucket: ${ARCHIVE_S3_BUCKET}
      access-key: ${ARCHIVE_S3_ACCESS_KEY}
      secret-key: ${ARCHIVE_S3_SECRET_KEY}
      path-style-access: ${ARCHIVE_S3_PATH_STYLE_ACCESS:true}

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is reachable over HTTP; it is what the monitoring probes call.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

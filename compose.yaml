# Local development services. Credentials below are development defaults only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${ARCHIVE_DB_NAME:-archive}
      POSTGRES_USER: ${ARCHIVE_DB_USERNAME:-archive}
      POSTGRES_PASSWORD: ${ARCHIVE_DB_PASSWORD:-archive}
    ports:
      - "${ARCHIVE_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts only run on an empty data volume: use "docker compose down -v" to replay them.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:

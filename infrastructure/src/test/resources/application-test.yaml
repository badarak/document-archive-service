# In-memory H2 in PostgreSQL compatibility mode, so the Liquibase SQL files run unchanged.
spring:
  datasource:
    url: jdbc:h2:mem:archive;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS archive
    username: sa
    password: test
  # Placeholder authorization server: only the tests that serve their own key set validate tokens.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.test
          jwk-set-uri: https://auth.test/jwks
          audiences: document-archive-service

# Readable logs in the test output instead of JSON lines.
logging:
  structured:
    format:
      console: ""

# Placeholder storage settings: the S3 client is built but never contacts a server in tests.
archive:
  # Journey tests run the reconciliation themselves, so it is never scheduled in tests.
  reconciliation:
    enabled: false
  storage:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: test-bucket
      access-key: test-access-key
      secret-key: test-secret-key

server:
  tomcat:
    # A refused upload is read to its end, up to this size, so the client receives the 413 instead of a
    # connection reset. It stays above the multipart request limit below.
    max-swallow-size: 64MB

spring:
  application:
    name: document-archive-service
  lifecycle:
    # On shutdown, requests in progress are finished first. The wait exceeds the storage api-call-timeout, so that an
    # upload is not cut and its archiving left pending. The orchestrator must give at least as long before killing the
    # process (terminationGracePeriodSeconds on Kubernetes).
    timeout-per-shutdown-phase: ${ARCHIVE_SHUTDOWN_TIMEOUT:150s}
  datasource:
    url: ${ARCHIVE_DB_URL}
    username: ${ARCHIVE_DB_USERNAME}
    password: ${ARCHIVE_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  liquibase:
    # The archive schema is provisioned outside the application and must exist before startup:
    # Liquibase stores its tracking tables in it.
    liquibase-schema: archive
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Liquibase; Hibernate only checks that entities match it.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Access tokens must come from this issuer, carry a signature that one of its published
          # public keys verifies, and be intended for this service. Setting both URIs avoids any
          # call to the issuer at startup.
          issuer-uri: ${ARCHIVE_JWT_ISSUER}
          jwk-set-uri: ${ARCHIVE_JWT_JWKS_URI}
          audiences: ${ARCHIVE_JWT_AUDIENCE}
          # Signature algorithms accepted from the issuer; an unsigned token is always refused.
          jws-algorithms: ${ARCHIVE_JWT_ALGORITHMS:RS256}

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema), with the MDC and the key-value pairs of each log; empty for
      # the readable format, as in the local profile.
      console: ${ARCHIVE_LOG_FORMAT:ecs}

archive:
  # The log line of each API operation names the tenant of the caller only if the logging policy allows it.
  logging:
    include-tenant: ${ARCHIVE_LOG_TENANT:false}
  security:
    claims:
      tenant: ${ARCHIVE_JWT_TENANT_CLAIM:tenant_id}
      source: ${ARCHIVE_JWT_SOURCE_CLAIM:azp}
  documents:
    allowed-extensions: ${ARCHIVE_ALLOWED_EXTENSIONS:pdf,doc,docx,mp3,wav,m4a,eml}
  # Finishes the deletions left DELETING and abandons the archivings left PENDING, once their grace period is over.
  # The grace period must exceed the storage api-call-timeout, or the application does not start.
  reconciliation:
    enabled: ${ARCHIVE_RECONCILIATION_ENABLED:true}
    interval: ${ARCHIVE_RECONCILIATION_INTERVAL:5m}
    grace-period: ${ARCHIVE_RECONCILIATION_GRACE_PERIOD:15m}
    batch-size: ${ARCHIVE_RECONCILIATION_BATCH_SIZE:100}
  storage:
    s3:
      endpoint: ${ARCHIVE_S3_ENDPOINT}
      region: ${ARCHIVE_S3_REGION}
      bucket: ${ARCHIVE_S3_BUCKET}
      access-key: ${ARCHIVE_S3_ACCESS_KEY}
      secret-key: ${ARCHIVE_S3_SECRET_KEY}
      path-style-access: ${ARCHIVE_S3_PATH_STYLE_ACCESS:true}
      api-call-timeout: ${ARCHIVE_S3_API_CALL_TIMEOUT:2m}

# The OpenAPI description and the Swagger UI are public, so they are off unless explicitly enabled.
springdoc:
  # Security schemes of the OpenAPI description, with the field names of the specification. springdoc only takes them
  # from here while the code declares none. A profile that adds a scheme must also repeat the whole security list,
  # since a list is replaced, not merged.
  open-api:
    components:
      securitySchemes:
        bearer-jwt:
          type: http
          scheme: bearer
          bearerFormat: JWT
    security:
      - bearer-jwt: []
  api-docs:
    enabled: ${ARCHIVE_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${ARCHIVE_OPENAPI_ENABLED:false}

management:
  # Traces: every request gets a trace whose identifier is in the MDC, hence in every log line and error answer. A share
  # of them is recorded, and sent only once MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT names an OTLP collector.
  tracing:
    sampling:
      probability: ${ARCHIVE_TRACING_SAMPLING:0.1}
  otlp:
    metrics:
      export:
        # The metrics are scraped by Prometheus; the OpenTelemetry starter would also push them over OTLP.
        enabled: false
  metrics:
    # Every series names the service, to tell it apart from the others scraped by the same monitoring.
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        # The health endpoint, open to the probes, and the Prometheus scraping endpoint, which requires the metrics:read
        # scope. Setting MANAGEMENT_SERVER_PORT moves both to a port of their own, to keep off the public network.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
